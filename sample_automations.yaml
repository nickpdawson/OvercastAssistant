# Overcast for Home Assistant: sample automations
#
# Paste any of these into automations.yaml, or into the YAML editor of a
# new automation. Change the media_player entities and podcast names to
# your own. Needs Home Assistant 2024.10 or later for the triggers:/actions:
# syntax.

# Morning news: the newest episode of The Daily at 7:00 on weekdays.
# It is marked played in Overcast if it plays to the end.
- alias: "Morning news - The Daily"
  triggers:
    - trigger: time
      at: "07:00:00"
  conditions:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
    - condition: state
      entity_id: binary_sensor.someone_home
      state: "on"
  actions:
    - action: media_player.volume_set
      target:
        entity_id: media_player.kitchen
      data:
        volume_level: 0.30
    - action: overcast.play_latest
      data:
        podcasts:
          - "The Daily"
        target_player: media_player.kitchen

# Weekend queue: three shows back to back on Saturday morning. The first
# plays now; each of the others starts when the one before it reaches its
# end. Stopping playback by hand clears the rest of the queue.
- alias: "Weekend podcasts"
  triggers:
    - trigger: time
      at: "08:00:00"
  conditions:
    - condition: time
      weekday: [sat]
  actions:
    - action: media_player.volume_set
      target:
        entity_id: media_player.living_room
      data:
        volume_level: 0.35
    - action: overcast.play_latest
      data:
        podcasts:
          - "Up First"
          - "Accidental Tech Podcast"
          - "Blank Check with Griffin & David"
        target_player: media_player.living_room
        mark_played: true
        resume_position: true

# Arriving home: pick up The Ezra Klein Show where Overcast left off,
# and record 1.25x as the speed in Overcast.
- alias: "Arrive home podcast"
  triggers:
    - trigger: zone
      entity_id: person.you
      zone: zone.home
      event: enter
  conditions:
    - condition: time
      after: "16:00:00"
      before: "20:00:00"
  actions:
    - action: overcast.play_latest
      data:
        podcasts:
          - "The Ezra Klein Show"
        target_player: media_player.living_room
        speed: 1.25

# Bedtime: play at low volume and pause after 30 minutes. Pausing saves
# the position in Overcast, so tomorrow it resumes from there. A stop
# would also save the position and never marks the episode played.
# mode: restart resets the timer if bedtime mode is turned on again.
- alias: "Bedtime podcast"
  mode: restart
  triggers:
    - trigger: state
      entity_id: input_boolean.bedtime_mode
      to: "on"
  actions:
    - action: media_player.volume_set
      target:
        entity_id: media_player.bedroom
      data:
        volume_level: 0.15
    - action: overcast.play_latest
      data:
        podcasts:
          - "Fresh Air"
        target_player: media_player.bedroom
        resume_position: true
    - delay:
        minutes: 30
    - condition: state
      entity_id: media_player.bedroom
      state: "playing"
    - action: media_player.media_pause
      target:
        entity_id: media_player.bedroom

# Workout: an NFC tag in the garage starts two shows in a row.
- alias: "Workout podcasts"
  triggers:
    - trigger: tag
      tag_id: gym_nfc_tag
  actions:
    - action: media_player.volume_set
      target:
        entity_id: media_player.garage
      data:
        volume_level: 0.60
    - action: overcast.play_latest
      data:
        podcasts:
          - "MacBreak Weekly"
          - "Mac Power Users"
        target_player: media_player.garage
        speed: 1.5

# Mark an episode played without listening. Fire an overcast_mark_played
# event with episode_url set to an https://overcast.fm/+... link. Any
# other host is rejected.
- alias: "Mark episode played"
  triggers:
    - trigger: event
      event_type: overcast_mark_played
  actions:
    - action: overcast.mark_played
      data:
        episode_url: "{{ trigger.event.data.episode_url }}"

# Refresh after subscribing to a new podcast in the app.
- alias: "Refresh Overcast library"
  triggers:
    - trigger: event
      event_type: overcast_refresh
  actions:
    - action: overcast.refresh

# Cooking: play when the kitchen motion sensor fires around meal times,
# but only if the speaker is not already busy.
- alias: "Cooking podcast"
  triggers:
    - trigger: state
      entity_id: binary_sensor.kitchen_motion
      to: "on"
  conditions:
    - condition: or
      conditions:
        - condition: time
          after: "11:30:00"
          before: "13:00:00"
        - condition: time
          after: "17:00:00"
          before: "19:00:00"
    - condition: state
      entity_id: media_player.kitchen
      state: "idle"
  actions:
    - action: media_player.volume_set
      target:
        entity_id: media_player.kitchen
      data:
        volume_level: 0.25
    - action: overcast.play_latest
      data:
        podcasts:
          - "Home Assistant Podcast"
          - "How Did This Get Made?"
        target_player: media_player.kitchen

# Voice: "play my podcasts" through Assist.
- alias: "Voice - play podcasts"
  triggers:
    - trigger: conversation
      command:
        - "play my podcasts"
        - "play podcasts"
        - "play the daily"
  actions:
    - action: overcast.play_latest
      data:
        podcasts:
          - "The Daily"
          - "Up First"
        target_player: media_player.kitchen
        mark_played: true
