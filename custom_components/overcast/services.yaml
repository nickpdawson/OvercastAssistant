play_latest:
  fields:
    podcasts:
      required: true
      example: "Up First"
      selector:
        text:
          multiple: true
    target_player:
      required: true
      example: "media_player.living_room"
      selector:
        entity:
          domain: media_player
    mark_played:
      default: true
      selector:
        boolean:
    resume_position:
      default: true
      selector:
        boolean:
    speed:
      example: 1.25
      selector:
        number:
          min: 0.75
          max: 2.25
          step: 0.125
          mode: box
    config_entry_id:
      selector:
        config_entry:
          integration: overcast

mark_played:
  fields:
    episode_url:
      required: true
      example: "https://overcast.fm/+d5BN-RlCs"
      selector:
        text:
          type: url
    config_entry_id:
      selector:
        config_entry:
          integration: overcast

refresh:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: overcast
